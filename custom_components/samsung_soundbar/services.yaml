set_speaker_level:
  name: Set Speaker Level
  description: Adjust the volume of an individual speaker channel (center, side, rear, etc.)
  target:
    device:
      integration: samsung_soundbar
  fields:
    speaker_channel:
      name: Speaker Channel
      description: Which speaker to adjust
      required: true
      example: "Spk_Center"
      selector:
        select:
          options:
            - "Spk_Center"
            - "Spk_Side"
            - "Spk_Wide"
            - "Spk_Front_Top"
            - "Spk_Rear"
            - "Spk_Rear_Top"
    level:
      name: Level
      description: Volume level (-6 to +6)
      required: true
      example: 0
      selector:
        number:
          min: -6
          max: 6
          step: 1

apply_preset:
  name: Apply Preset
  description: Apply a combination of sound settings in one call. Only the fields you provide are changed.
  target:
    device:
      integration: samsung_soundbar
  fields:
    sound_mode:
      name: Sound Mode
      description: Sound mode to apply (e.g. "adaptive sound", "standard", "surround", "game")
      required: false
      example: "adaptive sound"
      selector:
        text:
    eq_preset:
      name: EQ Preset
      description: Equalizer preset name
      required: false
      example: "BassBoost"
      selector:
        text:
    night_mode:
      name: Night Mode
      description: Enable or disable night mode
      required: false
      example: true
      selector:
        boolean:
    woofer_level:
      name: Woofer Level
      description: Subwoofer level (-6 to +6)
      required: false
      example: 0
      selector:
        number:
          min: -6
          max: 6
          step: 1

set_rear_speaker_mode:
  name: Set Rear Speaker Mode
  description: Switch rear speakers between front and rear positioning
  target:
    device:
      integration: samsung_soundbar
  fields:
    mode:
      name: Mode
      description: Front or Rear
      required: true
      example: "Rear"
      selector:
        select:
          options:
            - "Front"
            - "Rear"
